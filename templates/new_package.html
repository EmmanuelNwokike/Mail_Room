{% extends "base.html" %}

{% block content %}
<h2>Record Delivered Package (Known Resident)</h2>

<form method="post" action="{{ url_for('new_package') }}" class="mt-3">
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Resident Full Name</label>
            <input type="text" name="resident_name" class="form-control" placeholder="Kittie Mousdall" required>
        </div>
        <div class="col-md-2">
            <label class="form-label">Unit Number</label>
            <input type="number" name="unit_number" class="form-control" placeholder="101" required>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Label Name (Name on Package)</label>
        <input type="text" name="label_name" class="form-control" placeholder="Kittie Mousdall" required>
    </div>

    <div class="row mb-3">
        <div class="col-md-4">
            <label class="form-label">Carrier</label>
            <select name="carrier" class="form-select" required>
                <option value="">-- Select Carrier --</option>
                <option value="FedEx">FedEx</option>
                <option value="UPS">UPS</option>
                <option value="USPS">USPS</option>
                <option value="DHL">DHL</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Tracking Number (optional)</label>
            <input type="text" name="tracking_number" class="form-control" placeholder="FDX123456">
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Save & Send Email</button>
    <a href="{{ url_for('pending_packages') }}" class="btn btn-secondary ms-2">Cancel</a>
</form>
{% endblock %}
